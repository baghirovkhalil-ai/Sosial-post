<!doctype html>
<html lang="az"><head><meta charset="utf-8">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
/* Brand v3 "Editorial Kinetic": paper white / ink / lime marker / signal red
   Display: Unbounded · Text: Onest (both full Azərbaycan glyph support, OFL) */
:root{--paper:#fafaf7;--ink:#0b0b0c;--lime:#d4ff3a;--red:#ff3b2f;--muted:#6e6e73;--line:#e6e6e1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:var(--paper);font-family:Onest,sans-serif;color:var(--ink)}
#bg,#fx{position:absolute;inset:0;pointer-events:none}
#cam{position:absolute;inset:0;transform-origin:40% 45%}
.layer{position:absolute;inset:0}
.D{font-family:Unbounded,sans-serif}
/* header */
.brand{position:absolute;top:92px;left:80px;font-weight:800;font-size:25px;letter-spacing:6px}
.brand i{display:inline-block;width:14px;height:14px;background:var(--lime);border:3px solid var(--ink);border-radius:50%;margin-right:14px;vertical-align:1px;font-style:normal}
.tag{position:absolute;top:80px;right:80px;font-weight:800;font-size:23px;letter-spacing:3px;border:3px solid var(--ink);border-radius:40px;padding:10px 22px;background:#fff;text-transform:uppercase}
.prog{position:absolute;top:168px;left:80px;right:80px;display:flex;gap:10px}
.prog b{flex:1;height:7px;border-radius:4px;background:rgba(11,11,12,.1);overflow:hidden}
.prog b i{display:block;height:100%;background:var(--ink);width:0}
.slide .brand{top:62px;left:70px}.slide .tag{top:50px;right:70px}
/* scene layout */
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:250px 110px 520px 80px;gap:36px}
.scene.center{align-items:center;text-align:center;padding-right:80px}
.slide .scene{padding:150px 70px 130px;gap:28px}
.small{font-weight:700;font-size:46px;color:var(--muted);line-height:1.2}
.big{font-family:Unbounded;font-weight:800;font-size:116px;line-height:1.04;letter-spacing:-4px}
.big.sm{font-size:96px;letter-spacing:-3px}.big.xs{font-size:80px;letter-spacing:-2px}.big.xxs{font-size:66px;letter-spacing:-2px}
.sub{font-weight:800;font-size:56px;line-height:1.18;letter-spacing:-1px}
.slide .big{font-size:96px}.slide .big.sm{font-size:82px}.slide .big.xs{font-size:68px}.slide .big.xxs{font-size:56px}
.slide .sub{font-size:48px}.slide .small{font-size:40px}
/* marker / accents */
.mk{background:linear-gradient(var(--lime),var(--lime)) no-repeat 0 62%/var(--mk,100%) 72%;padding:0 .06em;margin:0 -.06em}
.inv{background:var(--ink);color:var(--lime);padding:0 .14em;border-radius:.12em}
.c-red{color:var(--red)}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:.04em .02em .14em;margin:-.04em 0 -.14em}
.w>i{display:inline-block;font-style:normal;will-change:transform}
/* cards: neo-brutal offset shadow */
.card{background:#fff;border:4px solid var(--ink);border-radius:30px;padding:40px 46px;width:100%;text-align:left;box-shadow:12px 12px 0 var(--ink)}
.sticker{display:inline-flex;align-items:center;gap:12px;font-weight:800;font-size:26px;letter-spacing:3px;padding:10px 20px;border:3px solid var(--ink);border-radius:14px;background:var(--lime);transform:rotate(-2deg);text-transform:uppercase}
.sticker.red{background:var(--red);color:#fff}.sticker.ink{background:var(--ink);color:var(--lime)}
.cmp{display:flex;flex-direction:column;gap:40px;width:100%}
.cmp .card{font-size:48px;font-weight:800;line-height:1.22}
.cmp .sticker{margin-bottom:20px}
.cmp .good{background:var(--lime)}
.cmp .bad .tx{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:5px}
.list{display:flex;flex-direction:column;gap:26px;width:100%}
.li{display:flex;align-items:center;gap:28px;background:#fff;border:4px solid var(--ink);border-radius:26px;padding:26px 32px;font-weight:800;font-size:46px;line-height:1.15;text-align:left;box-shadow:8px 8px 0 var(--ink)}
.li b{flex:none;width:76px;height:76px;border-radius:18px;display:grid;place-items:center;background:var(--paper);border:3px solid var(--ink);font-family:Unbounded;font-size:30px}
.li b svg{width:44px;height:44px}
/* step */
.num{font-family:Unbounded;font-weight:900;font-size:300px;line-height:.86;letter-spacing:-14px;color:transparent;-webkit-text-stroke:5px var(--ink);position:relative}
.num.fill{color:var(--lime)}.num.ink{color:var(--ink)}.num.red{-webkit-text-stroke-color:var(--red);color:transparent}
.slide .num{font-size:220px}
.stat{font-family:Unbounded;font-weight:900;font-size:230px;line-height:1;letter-spacing:-10px}
/* chat */
.chat{width:100%;display:flex;flex-direction:column;gap:28px;text-align:left}
.msg{max-width:90%;padding:28px 34px;border-radius:30px;font-weight:700;font-size:40px;line-height:1.3;border:4px solid var(--ink)}
.msg.u{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:8px}
.msg.a{align-self:flex-start;background:#fff;border-bottom-left-radius:8px;box-shadow:8px 8px 0 var(--ink)}
.msg .who{display:inline-block;font-size:22px;font-weight:800;letter-spacing:3px;margin-bottom:12px;padding:4px 12px;border-radius:8px;background:var(--lime);color:var(--ink)}
.msg.u .who{background:#fff}
/* cta */
.btn{background:var(--ink);color:#fff;font-weight:800;font-size:58px;padding:32px 70px;border-radius:90px;white-space:nowrap;border:4px solid var(--ink);box-shadow:10px 10px 0 var(--lime)}
.handle{font-weight:800;font-size:42px}
.ph-wrap{position:relative;display:grid;place-items:center;width:600px;height:560px}
.ph-ring{position:absolute;width:520px;height:520px;border-radius:50%;background:var(--lime);border:5px solid var(--ink);bottom:0}
.photo{position:absolute;left:0;bottom:0;width:600px;height:560px;object-fit:cover;object-position:50% 0;-webkit-mask:linear-gradient(#000 0 0) 50% 0/430px 300px no-repeat,radial-gradient(circle 257px at 300px 300px,#000 99%,transparent 100%)}
.slide .ph-wrap{transform:scale(.72);margin:-78px 0}
/* captions: karaoke word highlight, no box */
.cap{position:absolute;left:70px;right:70px;bottom:300px;font-weight:800;font-size:50px;line-height:1.3;text-align:center}
.cap .cw{margin:0 -.06em;padding:.02em .1em;border-radius:12px}
.cap .cw.on{background:var(--lime)}
.slide .cap{display:none}
.swipe{position:absolute;bottom:52px;right:70px;font-weight:800;font-size:30px;background:var(--lime);border:3px solid var(--ink);border-radius:40px;padding:10px 24px}
.pg{position:absolute;bottom:60px;left:70px;font-family:Unbounded;font-weight:800;font-size:26px}
svg{overflow:visible}
.vis-wrap{align-self:center}
.slide svg.vis{transform:scale(.7);margin:-60px 0}
</style></head>
<body><canvas id="bg"></canvas><div id="cam"><div class="layer" id="root"></div></div><canvas id="fx"></canvas>
<script>
const SPEC=window.SPEC;const MODE=window.MODE||'reel';
const W=1080,H=MODE==='reel'?1920:1350;
document.documentElement.style.setProperty('--W',W+'px');document.documentElement.style.setProperty('--H',H+'px');
if(MODE==='slide')document.body.classList.add('slide');
const cv=document.getElementById('bg');cv.width=W;cv.height=H;const g=cv.getContext('2d');
const fx=document.getElementById('fx');fx.width=W;fx.height=H;const f=fx.getContext('2d');
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const spring=x=>{x=clamp(x);return 1-Math.exp(-6*x)*Math.cos(9*x)};
const INK='#0b0b0c',LIME='#d4ff3a',RED='#ff3b2f';

/* paper grain (static) */
const grain=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const im=x.createImageData(W,H);
  let s=12345;for(let i=0;i<im.data.length;i+=4){s=(s*1664525+1013904223)>>>0;const v=s>>>24;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=v<40?10:0}x.putImageData(im,0,0);return c})();
function drawBg(t){
  g.fillStyle='#fafaf7';g.fillRect(0,0,W,H);
  // soft lime glow drifting
  const x=W*(.82+.08*Math.sin(t*.3)),y=H*(.2+.05*Math.cos(t*.25));const rg=g.createRadialGradient(x,y,0,x,y,W*.75);
  rg.addColorStop(0,'rgba(212,255,58,.30)');rg.addColorStop(1,'rgba(212,255,58,0)');g.fillStyle=rg;g.fillRect(0,0,W,H);
  // editorial grid lines, slow drift
  const st=90,o=(t*10)%st;g.strokeStyle='rgba(11,11,12,.045)';g.lineWidth=2;g.beginPath();
  for(let xx=-o;xx<W;xx+=st){g.moveTo(xx,0);g.lineTo(xx,H)}for(let yy=-o;yy<H;yy+=st){g.moveTo(0,yy);g.lineTo(W,yy)}g.stroke();
  g.drawImage(grain,0,0);
}
/* signature transition: lime + ink panels wipe upward at scene start */
function drawFx(lt,isFirst){
  f.clearRect(0,0,W,H);if(MODE!=='reel'||isFirst||lt>.5)return;
  const p=easeIO(lt/.5);
  f.fillStyle=LIME;f.fillRect(0,H-(H*2)*p,W,H);   // lime panel moves from bottom (covering) to top (gone)
  f.fillStyle=INK;f.fillRect(0,H-(H*2)*p+H-14,W,14);
}

const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
// *x* = lime marker, _x_ = ink pill with lime text, ~x~ = red
const fmt=s=>esc(s).replace(/\*(.+?)\*/g,'<span class="mk">$1</span>').replace(/_(.+?)_/g,'<span class="inv">$1</span>').replace(/~(.+?)~/g,'<span class="c-red">$1</span>');
function words(html){const d=document.createElement('div');d.innerHTML=html;let out='';
  d.childNodes.forEach(n=>{const cls=n.nodeType===1?n.className:'';n.textContent.split(/(\s+)/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w)){out+=' ';return}
    out+=`<span class="w"><i class="${cls}">${esc(w)}</i></span>`})});return out}
const sentence=s=>{s=String(s??'');return s===s.toUpperCase()&&/[A-ZƏÖÜÇŞĞI]/.test(s)&&s.length>3?s.charAt(0)+s.slice(1).toLocaleLowerCase('az'):s};
const bigCls=s=>{const L=Math.max(...String(s).replace(/[*_~]/g,'').split(/\s+/).map(w=>w.length));return L>13?'big xxs':L>10?'big xs':L>8?'big sm':'big'};
const A=(d,extra='')=>`data-in="${d}" ${extra}`;
const CHECK=`<svg viewBox="0 0 46 46"><path class="ck" d="M9 24 L19 33 L37 12" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></svg>`;
const VIS={
 target:()=>`<svg class="vis" width="520" height="520" viewBox="-260 -260 520 520" data-vis="target">${[240,170,100].map((r,i)=>`<circle class="rg" data-r="${r}" r="0" fill="${i==2?LIME:'none'}" stroke="${INK}" stroke-width="${i==1?3:6}" ${i==1?'stroke-dasharray="14 14"':''}/>`).join('')}<g class="orb">${[0,1,2,3,4,5].map(i=>`<rect x="${Math.cos(i*1.047)*240-12}" y="${Math.sin(i*1.047)*240-12}" width="24" height="24" fill="${i%2?INK:LIME}" stroke="${INK}" stroke-width="4"/>`).join('')}</g><g class="hit"><circle r="34" fill="${INK}"/></g></svg>`,
 bars:()=>`<svg class="vis" width="640" height="420" viewBox="0 0 640 420" data-vis="bars">${[0.3,0.45,0.38,0.6,0.75,1].map((h,i)=>`<rect class="b" data-h="${h}" x="${i*108}" width="84" rx="10" y="400" height="0" fill="${i==5?LIME:'#fff'}" stroke="${INK}" stroke-width="5"/>`).join('')}<line x1="-10" x2="650" y1="402" y2="402" stroke="${INK}" stroke-width="6"/></svg>`,
 cross:()=>`<svg class="vis" width="700" height="420" viewBox="0 0 700 420" data-vis="cross"><path class="ln" d="M10 40 C 240 80, 460 300, 690 370" stroke="${RED}" stroke-width="12" fill="none" stroke-linecap="round" pathLength="1"/><path class="ln" d="M10 380 C 220 340, 420 160, 690 30" stroke="${INK}" stroke-width="14" fill="none" stroke-linecap="round" pathLength="1"/></svg>`,
 check:items=>`<div class="list">${(items||[]).map((x,i)=>`<div class="li" ${A(0.35+i*0.4)} data-slide="1"><b data-ck="${0.55+i*0.4}">${CHECK}</b><span>${fmt(x)}</span></div>`).join('')}</div>`,
};
function sceneHTML(s,i,n){
  const k=s.kind;let h='',cls='';
  if(k==='hook'){h=`${s.small?`<div class="small" ${A(0)}>${fmt(s.small)}</div>`:''}<div class="${bigCls(s.big)}" data-words="0.1">${words(fmt(sentence(s.big)))}</div>${s.sub?`<div class="sub" ${A(0.7)}>${fmt(s.sub)}</div>`:''}`;
    if(s.stat)h+=`<div class="card" ${A(1.0,'data-pop="1"')}><div class="small" style="font-size:34px">${fmt(s.stat.label)}</div><div class="stat" style="font-size:110px;letter-spacing:-4px" data-count="${s.stat.value}" data-cin="1.0" data-suffix="${esc(s.stat.suffix||'')}">0</div></div>`}
  else if(k==='step'){const nc=s.color==='yellow'?'ink':s.color==='red'?'red':'fill';
    h=`<div class="num ${nc}" ${A(0,'data-numin="1"')}>${esc(s.num)}</div><div class="${bigCls(s.title)}" data-words="0.15">${words(fmt(sentence(s.title)))}</div>${s.sub?`<div class="small" style="color:${INK};font-weight:600" ${A(0.55)}>${fmt(s.sub)}</div>`:''}${s.visual&&VIS[s.visual]?`<div class="vis-wrap" ${A(0.6)}>${VIS[s.visual](s.items)}</div>`:''}`}
  else if(k==='list'){h=`${s.title?`<div class="big xs" data-words="0">${words(fmt(s.title))}</div>`:''}${VIS.check(s.items)}`}
  else if(k==='compare'){h=`${s.title?`<div class="big xs" data-words="0">${words(fmt(s.title))}</div>`:''}<div class="cmp"><div class="card bad" ${A(0.3)} data-slide="1"><div class="sticker red">✕ ${esc(s.badLabel||'SƏHV')}</div><div class="tx">${fmt(s.bad)}</div></div><div class="card good" ${A(1.3)} data-slide="-1"><div class="sticker ink">✓ ${esc(s.goodLabel||'DÜZGÜN')}</div><div>${fmt(s.good)}</div></div></div>`}
  else if(k==='stat'){cls='center';h=`${s.small?`<div class="small" ${A(0)}>${fmt(s.small)}</div>`:''}<div class="stat" ${A(0.1,'data-pop="1"')}><span class="mk" data-count="${s.value}" data-cin="0.1" data-suffix="${esc(s.suffix||'')}">0</span></div><div class="sub" data-words="0.5">${words(fmt(s.label))}</div>${s.visual&&VIS[s.visual]?`<div class="vis-wrap" ${A(0.8)}>${VIS[s.visual]()}</div>`:''}`}
  else if(k==='chat'){h=`${s.title?`<div class="big xs" data-words="0">${words(fmt(s.title))}</div>`:''}<div class="chat">${(s.msgs||[]).map((m,j)=>`<div class="msg ${m.from==='ai'?'a':'u'}" ${A(0.3+j*1.4,'data-pop="1"')} ${m.from==='ai'?'data-type="1"':''}><span class="who">${m.from==='ai'?'AI':'SƏN'}</span><br><span class="tx" data-full="${esc(m.text)}">${esc(m.text)}</span></div>`).join('')}</div>`}
  else if(k==='cta'){cls='center';h=`${s.small?`<div class="small" ${A(0)}>${fmt(s.small)}</div>`:''}<div class="${bigCls(s.big)}" data-words="0.1">${words(fmt(sentence(s.big)))}</div>${s.sub?`<div class="sub" ${A(0.35)}>${fmt(s.sub)}</div>`:''}<div class="ph-wrap" ${A(0.45)} data-rise="1"><div class="ph-ring"></div><img class="photo" src="assets/khalil-cut.png"></div><div class="btn" ${A(0.85,'data-pop="1"')} data-pulse="1">${esc(s.button||'Direktə yaz →')}</div><div class="handle" ${A(1.05)}>@khalil.marketingone</div>`}
  const pg=MODE==='slide'?`<div class="pg">${String(i+1).padStart(2,'0')}/${String(n).padStart(2,'0')}</div>${i<n-1?'<div class="swipe">sürüşdür →</div>':''}`:'';
  return `<div class="scene ${cls}">${h}</div>${pg}`;
}
const scenes=SPEC.scenes;let starts=[],T=0;scenes.forEach(s=>{starts.push(T);T+=s.dur||4});window.TOTAL=T;
let cur=-1;
const capHTML=c=>words(esc(String(c).replace(/[*_~]/g,''))).replace(/class="w"/g,'class="w cw"');
function build(i){const s=scenes[i];
  const prog=MODE==='reel'?`<div class="prog">${scenes.map(()=>'<b><i></i></b>').join('')}</div>`:'';
  document.getElementById('root').innerHTML=`<div class="brand"><i></i>KHALIL BAGHIROV</div>${SPEC.tag?`<div class="tag">${esc(SPEC.tag)}</div>`:''}${prog}${sceneHTML(s,i,scenes.length)}${MODE==='reel'&&s.cap?`<div class="cap">${capHTML(s.cap)}</div>`:''}`}
const fmtNum=v=>Math.round(v).toLocaleString('en-US').replace(/,/g,' ');
window.renderAt=function(t){
  let i=scenes.length-1;for(let j=0;j<scenes.length;j++){if(t<starts[j]+(scenes[j].dur||4)){i=j;break}}
  if(i!==cur){build(i);cur=i}
  const s=scenes[i],lt=t-starts[i],dur=s.dur||4,R=MODE==='reel';
  drawBg(t);drawFx(lt,i===0);
  const cam=document.getElementById('cam');
  if(R){const z=1+.02*clamp(lt/dur)+(i>0?.05*(1-ease(lt/.6)):0);cam.style.transform=`scale(${z})`}
  document.querySelectorAll('.prog b i').forEach((b,j)=>{b.style.width=(j<i?100:j>i?0:100*clamp(lt/dur))+'%'});
  const D=R?1:0; // in slide mode everything is fully shown (lt is near scene end anyway)
  document.querySelectorAll('[data-in]').forEach(el=>{
    const st=parseFloat(el.dataset.in),p=(lt-st)/0.5;el.style.opacity=clamp(p*2.2);
    if(el.dataset.pop)el.style.transform=`scale(${.6+.4*spring(p)})`;
    else if(el.dataset.slide){const dx=parseFloat(el.dataset.slide)*440*(1-ease(p));el.style.transform=`translateX(${dx}px) rotate(${(1-ease(p))*parseFloat(el.dataset.slide)*5}deg)`}
    else if(el.dataset.rise)el.style.transform=`translateY(${(1-spring(p*.8))*380}px)`;
    else if(el.dataset.numin)el.style.transform=`translateX(${(1-ease(p))*-260}px) skewX(${(1-ease(p))*-12}deg)`;
    else el.style.transform=`translateY(${(1-ease(p))*50}px)`;
    if(el.dataset.pulse&&p>1)el.style.transform=`scale(${1+.03*Math.sin((lt-st)*7)})`;
    if(el.dataset.type){const tx=el.querySelector('.tx');const fu=tx.dataset.full;const n=Math.floor(clamp((lt-st-.2)/1.5)*fu.length);tx.textContent=fu.slice(0,n)+(n<fu.length?'▍':'')}
  });
  document.querySelectorAll('[data-count]').forEach(el=>{el.textContent=fmtNum(parseFloat(el.dataset.count)*ease((lt-parseFloat(el.dataset.cin))/1.2))+el.dataset.suffix});
  document.querySelectorAll('[data-words]').forEach(el=>{const st=parseFloat(el.dataset.words);
    el.querySelectorAll('.w>i').forEach((w,k)=>{const p=(lt-st-k*.08)/.45;w.style.transform=`translateY(${(1-ease(p))*115}%)`;w.style.opacity=clamp(p*3)})});
  // marker wipe: starts after the words are in
  document.querySelectorAll('.scene .mk').forEach((m,k)=>{m.style.setProperty('--mk',(100*ease((lt-.6-k*.25)/.45))+'%')});
  // captions: words appear + karaoke highlight
  document.querySelectorAll('.cap').forEach(el=>{const ws=[...el.querySelectorAll('.cw')];const span=Math.min(dur*.7,ws.length*.3);
    el.style.opacity=clamp((lt-.15)/.15);
    ws.forEach((w,k)=>{const a=.15+k*span/Math.max(1,ws.length),b=.15+(k+1)*span/Math.max(1,ws.length);const p=(lt-a)/.15;
      w.firstChild.style.opacity=clamp(.2+p);w.classList.toggle('on',lt>=a&&lt<b+.05)})});
  document.querySelectorAll('[data-ck]').forEach(b=>{const p=ease((lt-parseFloat(b.dataset.ck))/.35);b.style.background=p>0?LIME:'';
    b.style.transform=`rotate(${p>0?(1-spring((lt-parseFloat(b.dataset.ck))/.4))*-20:0}deg)`;const pa=b.querySelector('.ck');pa.style.strokeDasharray='1';pa.style.strokeDashoffset=1-p});
  document.querySelectorAll('[data-vis]').forEach(sv=>{const vp=clamp((lt-0.7)/1.3);
    if(sv.dataset.vis==='bars')sv.querySelectorAll('.b').forEach((b,j)=>{const hh=380*parseFloat(b.dataset.h)*spring((lt-0.7-j*0.1)/0.7);b.setAttribute('y',400-hh);b.setAttribute('height',Math.max(0,hh))});
    if(sv.dataset.vis==='cross')sv.querySelectorAll('.ln').forEach(l=>{l.style.strokeDasharray='1';l.style.strokeDashoffset=1-easeIO(vp)});
    if(sv.dataset.vis==='target'){sv.querySelectorAll('.rg').forEach((c,j)=>c.setAttribute('r',Math.max(0,parseFloat(c.dataset.r)*spring((lt-.6-j*.12)/.6))));
      sv.querySelector('.orb').setAttribute('transform',`rotate(${lt*25})`);sv.querySelector('.hit').setAttribute('transform',`scale(${Math.max(0,spring((lt-1.3)/.5))})`)}});
};
window.ready=document.fonts.ready.then(()=>Promise.all(['800','900','600'].map(w=>document.fonts.load(`${w} 40px Unbounded`,'Əə'))).then(()=>Promise.all(['600','700','800'].map(w=>document.fonts.load(`${w} 40px Onest`,'Əə'))))).then(()=>new Promise(r=>{const im=new Image();im.onload=im.onerror=r;im.src='assets/khalil-cut.png'}));
