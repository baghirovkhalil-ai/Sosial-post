<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:K;src:url(../engine/assets/fonts/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:K;src:url(../engine/assets/fonts/Inter-Bold.otf);font-weight:700}
@font-face{font-family:K;src:url(../engine/assets/fonts/Inter-ExtraBold.otf);font-weight:800}
@font-face{font-family:K;src:url(../engine/assets/fonts/Inter-Black.otf);font-weight:900}
/* Brand: white / ink / royal blue — 16:9 lesson version of the reels template */
:root{--ink:#0c0e14;--blue:#1c4eff;--blue2:#4a7bff;--red:#eb3c46;--muted:#6b7186;--line:#e3e6ee;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#f6f7fa;font-family:K,sans-serif;color:var(--ink)}
#bg{position:absolute;inset:0;background:linear-gradient(180deg,#f6f7fa,#eceff4);overflow:hidden}
#dots{position:absolute;inset:-60px;background-image:radial-gradient(rgba(12,14,20,.10) 1.6px,transparent 1.7px);background-size:44px 44px}
.glow{position:absolute;border-radius:50%;filter:blur(90px);background:rgba(74,123,255,.30)}
.sph{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0,#b9caff 18%,#4a7bff 48%,#1c4eff 70%,#0b2496 100%);box-shadow:0 30px 60px -20px rgba(20,40,140,.45)}
.sph.w{background:radial-gradient(circle at 32% 28%,#fff 0,#fff 30%,#dfe5f3 70%,#b8c1d6 100%);box-shadow:0 30px 60px -24px rgba(20,30,70,.3)}
.ringd{position:absolute;border-radius:50%;border:26px solid transparent;background:linear-gradient(#0000,#0000) padding-box,conic-gradient(#7c9bff,#1c4eff,#0b2496,#7c9bff) border-box;-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
.layer{position:absolute;inset:0}
.brand{position:absolute;top:50px;left:90px;font-weight:900;font-size:26px;letter-spacing:6px;display:flex;align-items:center;gap:14px}
.brand i{width:16px;height:16px;border-radius:50%;background:var(--blue);display:inline-block}
.pill{position:absolute;top:40px;right:90px;background:#fff;border:2px solid var(--line);border-radius:40px;padding:12px 24px;font-weight:800;font-size:21px;letter-spacing:2px}
.pill b{color:var(--blue)}
.foot{position:absolute;bottom:26px;font-weight:600;font-size:20px;color:#8a90a3}
.foot.l{left:90px}.foot.r{right:90px}
#prog{position:absolute;left:90px;right:90px;bottom:64px;display:flex;gap:8px}
#prog div{flex:1;height:5px;border-radius:3px;background:#dfe3ec;overflow:hidden}
#prog div i{display:block;height:100%;width:0;background:var(--blue)}
/* captions */
#cap{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);max-width:1500px;background:rgba(255,255,255,.92);border:2px solid var(--line);border-radius:22px;padding:14px 28px;font-weight:700;font-size:30px;line-height:1.3;text-align:center;box-shadow:0 20px 40px -24px rgba(20,30,70,.3);color:#9aa0b2}
#cap span.on{color:var(--ink)}
#cap span.now{color:var(--blue)}
/* words */
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .14em;margin-bottom:-.14em}
.w>i{display:inline-block;font-style:normal}
.hl{color:var(--blue)}
.content{position:absolute;left:150px;right:150px;top:150px;bottom:170px}
.kick{font-weight:800;font-size:30px;letter-spacing:4px;color:var(--blue);text-transform:uppercase}
.h1{font-weight:900;font-size:68px;line-height:1.05;letter-spacing:-2px}
.huge{font-weight:900;font-size:138px;line-height:1.02;letter-spacing:-5px;max-width:1500px}
.under{height:14px;border-radius:7px;background:var(--blue);transform-origin:left;margin-top:30px;width:420px}
.ghost{position:absolute;right:-40px;bottom:120px;font-weight:900;font-size:420px;letter-spacing:-20px;line-height:1;color:transparent;-webkit-text-stroke:5px rgba(28,78,255,.13)}
/* list cards */
.list{display:flex;flex-direction:column;gap:22px;margin-top:44px;max-width:1480px}
.li{display:flex;align-items:center;gap:28px;background:#fff;border:2px solid var(--line);border-radius:28px;padding:22px 32px;font-weight:800;font-size:42px;line-height:1.15;box-shadow:0 24px 50px -24px rgba(20,30,70,.22)}
.li .n{flex:none;width:68px;height:68px;border-radius:20px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:32px}
.li .ck{flex:none;width:64px;height:64px;border-radius:50%;background:#e9eefc;display:grid;place-items:center}
.li .ck svg{width:38px;height:38px}
/* steps (horizontal) */
.steps{display:flex;gap:34px;margin-top:70px;align-items:stretch}
.st{flex:1;background:#fff;border:2px solid var(--line);border-radius:30px;padding:34px 30px;box-shadow:0 24px 50px -24px rgba(20,30,70,.22);position:relative;min-height:300px}
.st .n{width:78px;height:78px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:36px;margin-bottom:26px}
.st p{font-weight:800;font-size:38px;line-height:1.15}
.arrow{position:absolute;right:-30px;top:72px;width:26px;height:6px;background:var(--blue);border-radius:3px;transform-origin:left}
/* formula */
.fcard{margin-top:70px;background:var(--ink);border-radius:40px;padding:60px 70px;display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;box-shadow:0 40px 80px -30px rgba(12,14,20,.5)}
.tok{font-weight:900;font-size:52px;color:#fff;letter-spacing:-1px;display:inline-block}
.tok.op{color:#7f9dff}
.note{margin-top:56px;font-weight:800;font-size:52px;line-height:1.15;display:inline-block}
.note .bar{height:10px;border-radius:5px;background:var(--blue);transform-origin:left;margin-top:12px}
/* compare */
.cmp{display:flex;gap:40px;margin-top:50px;position:relative}
.cc{flex:1;border-radius:34px;padding:40px 44px;border:2px solid var(--line);background:#fff;box-shadow:0 30px 60px -26px rgba(20,30,70,.25)}
.cc.good{background:var(--ink);border-color:var(--ink);color:#fff}
.lab{display:inline-flex;align-items:center;gap:14px;font-weight:900;font-size:28px;letter-spacing:3px;text-transform:uppercase;padding:10px 22px;border-radius:30px;color:#fff;background:var(--red)}
.good .lab{background:var(--blue)}
.ci{display:flex;gap:22px;align-items:center;font-weight:800;font-size:38px;line-height:1.2;margin-top:34px}
.ci b{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--red)}
.good .ci b{background:var(--blue)}
.ci b svg{width:30px;height:30px}
.vs{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:38px;box-shadow:0 20px 40px -18px rgba(20,30,70,.35)}
/* title & outro */
.tleft{position:absolute;left:150px;top:230px;width:900px}
.badge{display:inline-flex;align-items:center;gap:12px;background:var(--blue);color:#fff;font-weight:900;font-size:26px;letter-spacing:3px;padding:14px 26px;border-radius:40px}
.ttl{font-weight:900;font-size:108px;line-height:1.0;letter-spacing:-4px;margin-top:34px}
.sub{font-weight:700;font-size:40px;color:var(--muted);margin-top:30px;line-height:1.25}
.ph{position:absolute;right:120px;bottom:0;width:760px;height:900px}
.ph .disc{position:absolute;left:60px;top:150px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6f93ff,#1c4eff 55%,#0f2fb0)}
.ph .rg{position:absolute;left:10px;top:100px;width:740px;height:740px;border-radius:50%;border:3px dashed rgba(28,78,255,.35)}
.ph img{position:absolute;left:50%;bottom:0;width:720px;transform-origin:50% 100%;filter:drop-shadow(0 30px 40px rgba(20,40,120,.28))}
.chip{position:absolute;background:#fff;border:2px solid var(--line);border-radius:22px;padding:16px 22px;box-shadow:0 24px 50px -22px rgba(20,30,70,.3);font-weight:800;font-size:24px}
.chip small{display:block;font-weight:700;font-size:16px;letter-spacing:2px;color:var(--muted);margin-bottom:4px}
.btn{display:inline-flex;align-items:center;gap:16px;background:var(--red);color:#fff;font-weight:900;font-size:44px;padding:26px 56px;border-radius:70px;box-shadow:0 30px 60px -20px rgba(235,60,70,.5);margin-top:50px;position:relative}
.btn.done{background:#e3e6ee;color:var(--ink);box-shadow:none}
.cursor{position:absolute;width:56px;height:56px}
.handle{display:inline-block;margin-top:34px;font-weight:800;font-size:32px;background:#fff;border:2px solid var(--line);padding:12px 28px;border-radius:40px}
</style></head><body>
<div id="bg"><div id="dots"></div><div class="glow" id="g1" style="width:900px;height:900px"></div><div class="glow" id="g2" style="width:700px;height:700px;background:rgba(74,123,255,.22)"></div>
<div class="sph" id="s1" style="width:150px;height:150px"></div><div class="sph w" id="s2" style="width:90px;height:90px"></div><div class="sph" id="s3" style="width:56px;height:56px"></div>
<div class="ringd" id="r1" style="width:230px;height:230px"></div></div>
<div id="stage"></div>
<div class="brand">KHALIL BAGHIROV <i></i></div>
<div class="pill" id="pill"></div>
<div id="prog"></div>
<div id="cap"></div>
<div class="foot l">baghirovkhalil.com</div><div class="foot r">Meta Ads &nbsp;•&nbsp; Google Ads &nbsp;•&nbsp; TikTok Ads</div>
<script>
const S = window.SPEC;
const clamp = (x) => Math.max(0, Math.min(1, x));
const eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
const spring = (x) => { x = clamp(x); return 1 - Math.exp(-6 * x) * Math.cos(9 * x); };
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  checkb: '<svg viewBox="0 0 24 24" fill="none" stroke="#1c4eff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path class="draw" pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  cross: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  cursor: '<svg viewBox="0 0 24 24"><path d="M4 2l15 9.5-6.6 1.4L16 20l-3 1.4-3.6-7.2L4 18z" fill="#0c0e14" stroke="#fff" stroke-width="1.4"/></svg>'
};
// words with *highlight*
function words(text, t0, step, extra = '') {
  let out = '', k = 0;
  String(text).split(/(\*[^*]+\*)/).forEach((part) => {
    if (!part) return; const hi = part.startsWith('*');
    part.replace(/\*/g, '').split(' ').filter(Boolean).forEach((w) => {
      out += `<span class="w"><i class="a ${hi ? 'hl' : ''}" data-k="mask" data-t="${(t0 + k * step).toFixed(3)}" ${extra}>${esc(w)}</i></span> `; k++;
    });
  });
  return out;
}
const A = (t, k = 'up', d = 0.55) => `data-a="1" data-t="${t.toFixed(3)}" data-k="${k}" data-d="${d}"`;

function build(s, i) {
  const r = s.reveals || [];
  const it = (k) => r[k] ?? (0.6 + k * 0.8);
  if (s.type === 'title') return `<div class="tleft"><div ${A(0.2, 'pop')}><span class="badge">LESSON ${String(S.num).padStart(2, '0')} / 30</span></div>
      <div class="ttl">${words(S.title, 0.45, 0.09)}</div><div class="sub" ${A(1.3)}>${esc(S.subtitle)}</div></div>
      <div class="ph"><div class="rg a" data-k="spin" data-t="0"></div><div class="disc a" data-k="pop" data-t="0.3" data-d="0.9"></div><img class="a" data-k="rise" data-t="0.55" data-d="1" src="../engine/assets/khalil-cut.png">
      <div class="chip a" data-k="pop" data-t="1.6" style="left:-40px;top:250px"><small>FREE COURSE</small>30 lessons</div>
      <div class="chip a" data-k="pop" data-t="1.9" style="right:-10px;top:520px"><small>EVERY DAY</small>${S.course === 'meta' ? '18:00' : '19:00'} Baku</div></div>`;
  if (s.type === 'big') return `<div class="content" style="display:flex;flex-direction:column;justify-content:center">${s.kicker ? `<div class="kick" ${A(0.15, 'left')}>${esc(s.kicker)}</div>` : ''}
      <div class="huge" style="margin-top:26px">${words(s.text, 0.35, 0.12)}</div><div class="under a" data-k="grow" data-t="1.4" data-d="0.7"></div></div>
      <div class="ghost a" data-k="fade" data-t="0.2" data-d="1.2">${String(S.num).padStart(2, '0')}</div>`;
  if (s.type === 'points' || s.type === 'summary') return `<div class="content"><div class="h1">${words(s.title, 0.15, 0.07)}</div><div class="list">${
      s.items.map((x, k) => `<div class="li" ${A(it(k), 'left', 0.6)}>${s.type === 'summary' ? `<span class="ck a" data-k="pop" data-t="${(it(k) + 0.15).toFixed(3)}">${ICON.checkb}</span>` : `<span class="n a" data-k="pop" data-t="${(it(k) + 0.12).toFixed(3)}">${k + 1}</span>`}<span>${esc(x).replace(/\*([^*]+)\*/g, '<span class="hl">$1</span>')}</span></div>`).join('')}</div></div>`;
  if (s.type === 'steps') return `<div class="content"><div class="h1">${words(s.title, 0.15, 0.07)}</div><div class="steps">${
      s.items.map((x, k) => `<div class="st" ${A(it(k), 'up', 0.6)}><div class="n a" data-k="pop" data-t="${(it(k) + 0.15).toFixed(3)}">${k + 1}</div><p>${esc(x)}</p>${k < s.items.length - 1 ? `<div class="arrow a" data-k="grow" data-t="${(it(k) + 0.45).toFixed(3)}"></div>` : ''}</div>`).join('')}</div></div>`;
  if (s.type === 'formula') {
    const toks = s.formula.split(' '); const span = Math.max(0.12, Math.min(0.35, (r[0] ?? 3) * 0.6 / toks.length));
    return `<div class="content"><div class="h1">${words(s.title, 0.15, 0.07)}</div><div class="fcard a" data-k="scale" data-t="0.5" data-d="0.6">${
      toks.map((x, k) => `<span class="tok ${/^[=×+\-−÷x]$/.test(x) ? 'op' : ''} a" data-k="pop" data-t="${(0.9 + k * span).toFixed(3)}">${esc(x)}</span>`).join('')}</div>
      <div class="note a" data-k="up" data-t="${(r[0] ?? 3).toFixed(3)}">${esc(s.note).replace(/\*([^*]+)\*/g, '<span class="hl">$1</span>')}<div class="bar a" data-k="grow" data-t="${((r[0] ?? 3) + 0.4).toFixed(3)}" data-d="0.7"></div></div></div>`;
  }
  if (s.type === 'compare') {
    const bad = s.bad.map((x, k) => `<div class="ci a" data-k="left" data-t="${(0.9 + k * 0.45).toFixed(3)}"><b>${ICON.cross}</b>${esc(x)}</div>`).join('');
    const g0 = r[0] ?? 3;
    const good = s.good.map((x, k) => `<div class="ci a" data-k="left" data-t="${(g0 + 0.4 + k * 0.45).toFixed(3)}"><b>${ICON.check}</b>${esc(x)}</div>`).join('');
    return `<div class="content"><div class="h1">${words(s.title, 0.15, 0.07)}</div><div class="cmp">
      <div class="cc" ${A(0.45, 'up', 0.6)}><span class="lab">${esc(s.badLabel)}</span>${bad}</div>
      <div class="cc good" ${A(g0, 'up', 0.6)}><span class="lab">${esc(s.goodLabel)}</span>${good}</div>
      <div class="vs a" data-k="pop" data-t="${(g0 - 0.2).toFixed(3)}">VS</div></div></div>`;
  }
  if (s.type === 'outro') {
    const click = Math.max(2.4, (s.dur || 8) * 0.55);
    return `<div class="tleft" style="top:200px"><div class="kick" ${A(0.15, 'left')}>Next lesson</div><div class="ttl" style="font-size:92px">${words(s.next, 0.4, 0.09)}</div>
      <div class="btn a" data-k="pop" data-t="1.5" data-click="${click.toFixed(3)}"><span class="lbl">Subscribe</span></div><br>
      <div class="handle a" data-k="up" data-t="2.0">Instagram: @khalil.marketingone</div>
      <div class="cursor a" data-k="cursor" data-t="${(click - 1.1).toFixed(3)}" data-d="1.1">${ICON.cursor}</div></div>
      <div class="ph"><div class="rg a" data-k="spin" data-t="0"></div><div class="disc a" data-k="pop" data-t="0.3" data-d="0.9"></div><img class="a" data-k="rise" data-t="0.5" data-d="1" src="../engine/assets/khalil-cut.png"></div>`;
  }
  return '';
}

const stage = document.getElementById('stage');
const contentIdx = []; let ci = 0;
S.slides.forEach((s, i) => {
  const L = document.createElement('div'); L.className = 'layer'; L.innerHTML = build(s, i); L.style.opacity = 0; stage.appendChild(L); s.el = L;
  s.items_ = [...L.querySelectorAll('.a,[data-a]')].map((e) => ({ e, t: +e.dataset.t, k: e.dataset.k, d: +(e.dataset.d || 0.55) }));
  contentIdx.push(s.type === 'title' || s.type === 'outro' ? -1 : ci++);
});
document.getElementById('pill').innerHTML = `${S.courseLabel} &nbsp;·&nbsp; <b>LESSON ${String(S.num).padStart(2, '0')}</b>`;
const prog = document.getElementById('prog'); prog.innerHTML = Array.from({ length: ci }, () => '<div><i></i></div>').join('');
const bars = [...prog.querySelectorAll('i')];
// caption words
const SENTS = []; S.slides.forEach((s) => (s.sentences || []).forEach((x) => SENTS.push({ t0: s.start + x.t0, t1: s.start + x.t1, words: x.text.replace(/[*_~]/g, '').split(' ') })));
const cap = document.getElementById('cap'); let capIdx = -2;

function anim(o, lt) {
  const { e, t, k, d } = o; const x = (lt - t) / d; const p = eo(x);
  let op = clamp(x * 1.6), tr = '';
  switch (k) {
    case 'up': tr = `translateY(${(1 - p) * 60}px)`; break;
    case 'left': tr = `translateX(${(1 - p) * -90}px)`; break;
    case 'fade': op = clamp(x); break;
    case 'mask': op = 1; tr = `translateY(${(1 - p) * 110}%)`; break;
    case 'pop': { const sp = spring(x); tr = `scale(${0.2 + 0.8 * sp})`; op = clamp(x * 3); break; }
    case 'scale': tr = `scale(${0.85 + 0.15 * p})`; break;
    case 'rise': { const sp = spring(x * 0.9); tr = `translateX(-50%) translateY(${(1 - sp) * 380}px) scale(${1 + 0.008 * Math.sin(lt * 1.6)})`; op = clamp(x * 2); break; }
    case 'grow': op = 1; tr = `scaleX(${p})`; break;
    case 'spin': op = clamp(lt * 2); tr = `rotate(${lt * 18}deg)`; break;
    case 'cursor': { // glide to the button, click
      const btn = e.parentNode.querySelector('.btn'); const bx = btn.offsetLeft + btn.offsetWidth * 0.7, by = btn.offsetTop + btn.offsetHeight * 0.6;
      const q = eo(x); op = x > 0 ? 1 : 0; const sx = bx + 380, sy = by + 260;
      const click = x > 1 && x < 1.25 ? 0.85 : 1;
      tr = ''; e.style.left = (sx + (bx - sx) * q) + 'px'; e.style.top = (sy + (by - sy) * q) + 'px'; e.style.transform = `scale(${click})`; e.style.opacity = op; return;
    }
  }
  e.style.opacity = x <= 0 ? 0 : op; e.style.transform = tr;
  if (e.dataset.click) { const done = lt > +e.dataset.click; e.classList.toggle('done', done); e.querySelector('.lbl').textContent = done ? 'Subscribed' : 'Subscribe';
    if (done && lt - +e.dataset.click < 0.4) e.style.transform += ` scale(${1 - 0.08 * Math.sin((lt - +e.dataset.click) / 0.4 * Math.PI)})`; }
  if (k === 'pop' && e.querySelector && e.querySelector('.draw')) { const pth = e.querySelector('.draw'); pth.style.strokeDasharray = 1; pth.style.strokeDashoffset = 1 - eo((lt - t - 0.2) / 0.4); }
}

window.renderAt = (t) => {
  // ambient motion
  document.getElementById('dots').style.transform = `translate(${(t * 9) % 44}px, ${(t * 5) % 44}px)`;
  const g1 = document.getElementById('g1'), g2 = document.getElementById('g2');
  g1.style.left = (1250 + Math.sin(t * 0.21) * 120) + 'px'; g1.style.top = (-380 + Math.cos(t * 0.17) * 90) + 'px';
  g2.style.left = (-300 + Math.cos(t * 0.19) * 110) + 'px'; g2.style.top = (620 + Math.sin(t * 0.23) * 80) + 'px';
  const fl = (id, x, y, a, sp) => { const el = document.getElementById(id); el.style.left = x + 'px'; el.style.top = (y + Math.sin(t * sp) * a) + 'px'; };
  fl('s1', 1780, 860, 22, 0.9); fl('s2', 40, 170, 16, 1.2); fl('s3', 1700, 180, 12, 1.5);
  const r1 = document.getElementById('r1'); r1.style.left = '-130px'; r1.style.top = '690px'; r1.style.transform = `rotate(${t * 14}deg)`;
  // slides
  let cur = S.slides.length - 1;
  for (let i = 0; i < S.slides.length; i++) if (t < S.slides[i].start + S.slides[i].dur) { cur = i; break; }
  S.slides.forEach((s, i) => {
    const lt = t - s.start;
    if (i === cur) {
      const pin = eo(lt / 0.45); s.el.style.opacity = i === 0 ? 1 : pin; s.el.style.transform = i === 0 ? '' : `translateY(${(1 - pin) * 40}px)`;

    } else s.el.style.opacity = 0;
  });
